version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: b2b-postgres
    restart: always
    environment:
      POSTGRES_DB: b2b_orderhub
      POSTGRES_USER: b2b_admin
      POSTGRES_PASSWORD: b2b_password_secure123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/migrations/002_seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./database/migrations/003_product_moq.sql:/docker-entrypoint-initdb.d/03_product_moq.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2b_admin -d b2b_orderhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Node.js / NestJS Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: b2b-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-5000}
      DATABASE_URL: ${DATABASE_URL:-postgres://b2b_admin:b2b_password_secure123@postgres:5432/b2b_orderhub}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
    ports:
      - "5000:5000"

  # 3. React / Next.js Web Client Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: b2b-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
    driver: local
